<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04060D" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <script>
      // Pick Daylight or Nocturne before the first paint (see lib/state/theme.svelte.ts)
      (function () {
        try {
          var stored = localStorage.getItem("localsite.theme");
          var mode = stored ? JSON.parse(stored) : "auto";
          var hour = new Date().getHours();
          var theme = mode === "day" || mode === "night" ? mode : hour >= 6 && hour < 18 ? "day" : "night";
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    class="bg-background text-foreground"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
